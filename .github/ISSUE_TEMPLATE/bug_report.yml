name: Bug report
description: Report a bug in freerebuff
labels: ["type: bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to fill out this bug report.
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: A clear description of the bug.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Run `bun freebuff/cli/build.ts 0.0.0-dev`
        2. ...
  - type: input
    id: version
    attributes:
      label: Version
      description: Output of `freerebuff --version`
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, bun version, terminal
      placeholder: macOS 15.4 / bun 1.3.14 / Ghostty
