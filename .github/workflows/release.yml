name: Release artifacts

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: freebuffed-linux-x64
            target: linux-x64
            platform: linux
            arch: x64
          - os: ubuntu-24.04-arm
            name: freebuffed-linux-arm64
            target: linux-arm64
            platform: linux
            arch: arm64
          - os: macos-15
            name: freebuffed-darwin-arm64
            target: darwin-arm64
            platform: darwin
            arch: arm64
          - os: macos-15-intel
            name: freebuffed-darwin-x64
            target: darwin-x64
            platform: darwin
            arch: x64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.0.1
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build the SDK
        run: bun run build:sdk

      - name: Build the binary
        env:
          FREEBUFF_MODE: "true"
          OVERRIDE_TARGET: ${{ matrix.target }}
          OVERRIDE_PLATFORM: ${{ matrix.platform }}
          OVERRIDE_ARCH: ${{ matrix.arch }}
        run: |
          UPSTREAM_VERSION=$(cat UPSTREAM_VERSION)
          VERSION="${{ github.event.release.tag_name }}+freebuff.${UPSTREAM_VERSION}"
          bun cli/scripts/build-binary.ts freebuffed "$VERSION"

      - name: Upload binary to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          BIN="cli/bin/freebuffed"
          if [ ! -f "$BIN" ]; then
            echo "::error::binary not produced at $BIN" >&2
            exit 1
          fi
          chmod +x "$BIN"
          UPSTREAM_VERSION=$(cat UPSTREAM_VERSION)
          ASSET="freebuffed-${{ github.event.release.tag_name }}-freebuff-${UPSTREAM_VERSION}-${{ matrix.platform }}-${{ matrix.arch }}"
          cp "$BIN" "$ASSET"
          gh release upload "${{ github.event.release.tag_name }}" "$ASSET" --clobber
          echo "uploaded $ASSET"
